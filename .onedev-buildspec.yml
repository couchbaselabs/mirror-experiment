version: 39
jobs:
- name: Build Docker Files
  jobExecutor: k8s
  steps:
  - !CheckoutStep
    name: Checkout
    cloneCredential: !DefaultCredential {}
    withLfs: true
    withSubmodules: true
    cloneDepth: 1
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: LS
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        ls -lah
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !BuildImageWithKanikoStep
    name: Push Loopus
    output: !RegistryOutput
      destinations: onedev.onedev/loopus:latest
    moreOptions: --insecure-registry onedev.onedev
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: main
    paths: apps/**
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
